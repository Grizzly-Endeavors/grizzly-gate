# Python language adapter. Activated by a `pyproject.toml` at the source root.
# Each tool is pointed at the gate's own config, so a repo's pyproject/ruff/mypy
# settings cannot relax the checks.
name = "python"
marker = "pyproject.toml"

# Honest-map evidence: any `.py`/`.pyi` file (or extensionless `python`/`python3`
# shebang script) must be covered by a declared python project (harness `detect`).
[detect]
extensions = ["py", "pyi"]
shebangs = ["python", "python3"]

# Install the repo's deps into a per-project virtualenv BEFORE mypy/pytest run —
# the Node `npm ci` analog. Without this, third-party imports resolve to `Any`
# (mypy strict cascades) and the repo's own package isn't importable (pytest
# collection fails). uv is a gate-side installer detail using its pip interface
# against the repo's STANDARD inputs (requirements.txt / pyproject) — a repo never
# has to adopt uv. Hybrid first-party resolution: editable-install when the repo
# is a package (`[project]`/`[build-system]`), else install requirements.txt and
# let `pythonpath = .` (gate pytest.ini) resolve first-party code by rootdir.
# pytest is installed INTO the venv (it must run in-process with the deps; no
# `--python-executable` flag like mypy) at the Dockerfile-pinned version, exposed
# as $GATE_PYTEST_VERSION so the pin stays single-sourced. See ADR-032.
#
# The venv lives at `{work}/venv` — a per-project scratch dir inside the gate
# container, not `.venv` in the scanned repo. The gate mounts the working tree
# read-write, so anything written beside the source outlives the run in the
# caller's checkout; `{work}` is created and deleted per run, which keeps the
# tree clean and makes each run's dependency set reproducible rather than
# accreted. The `--python` flag on every install pins uv to that venv instead of
# whatever it would discover from the working directory. See ADR-042.
[[checks]]
name = "deps"
cmd = "sh -c 'set -eu; uv venv {work}/venv; if [ -f requirements.txt ]; then uv pip install --python {work}/venv/bin/python -r requirements.txt; fi; if grep -qE \"^\\[(project|build-system)\\]\" pyproject.toml; then uv pip install --python {work}/venv/bin/python -e .; fi; uv pip install --python {work}/venv/bin/python \"pytest==$GATE_PYTEST_VERSION\"'"

[[checks]]
name = "ruff"
# --output-format json emits diagnostics on stdout; ruff still exits non-zero on
# any violation, so the verdict is unchanged. --extend-exclude (NOT --exclude:
# verified on ruff 0.15 that --exclude REPLACES ruff's own default exclude list
# rather than adding to it, which would silently drop .venv/.git/etc.) forwards
# the Ops-owned skip_dirs so ruff skips the same generated/vendor dirs the
# honest-map walk does. Ruff's built-in defaults already cover .venv/venv/
# .mypy_cache/.pytest_cache/.ruff_cache/.tox/dist/node_modules, but NOT target/
# vendor/__pycache__/.cargo/.gradle/build/.svelte-kit — {skip_dirs} closes that
# gap regardless of which subset ruff's own defaults happen to cover.
#
# --cache-dir keeps ruff's incremental cache in the run's scratch dir instead of
# a `.ruff_cache` beside the source (ADR-042).
cmd = "ruff check --output-format json --extend-exclude {skip_dirs} --config {config}/ruff.toml --cache-dir {work}/ruff-cache ."
output = { parser = "ruff" }

[[checks]]
name = "mypy"
# --python-executable points mypy's import resolution at the repo's installed
# deps (in .venv) while mypy itself runs from its own pinned pipx venv.
# --output json emits newline-delimited diagnostics on stdout (mypy 1.11+); it
# still exits non-zero on type errors, so the verdict is unchanged.
#
# mypy's --exclude takes a single regex (matched against relative paths) and
# only affects RECURSIVE DIRECTORY DISCOVERY, not explicitly-passed files —
# irrelevant here since this check hands mypy `.` and lets it discover the
# tree itself. There is no comma-list form like ruff's --extend-exclude, so
# GATE_SKIP_DIRS (same mechanism eslint uses) carries the Ops-owned skip_dirs
# comma list and the `sh -c` wrapper turns it into a `(^|/)(a|b|c)(/|$)`
# alternation via `tr` at run time, so mypy skips the same generated/vendor
# dirs the honest-map walk does.
#
# --cache-dir keeps mypy's incremental cache in the run's scratch dir instead of
# a `.mypy_cache` beside the source (ADR-042).
cmd = "sh -c 'exec mypy --output json --config-file {config}/mypy.ini --python-executable {work}/venv/bin/python --cache-dir {work}/mypy-cache --exclude \"(^|/)($(printf %s \"$GATE_SKIP_DIRS\" | tr \",\" \"|\"))(/|$)\" .'"
env = { GATE_SKIP_DIRS = "{skip_dirs}" }
output = { parser = "mypy" }

[[checks]]
name = "pytest"
# Run from the venv so the repo's installed package + third-party deps import;
# the gate pytest.ini (pythonpath = .) covers the loose-layout case.
#
# `-p no:cacheprovider` disables pytest's cache plugin, which would otherwise
# write a `.pytest_cache` beside the source. Nothing here reads it — the gate
# runs a suite once, never `--last-failed` — so there is nothing to relocate to
# `{work}`, only something to switch off (ADR-042).
cmd = "{work}/venv/bin/pytest -c {config}/pytest.ini -p no:cacheprovider -q"
